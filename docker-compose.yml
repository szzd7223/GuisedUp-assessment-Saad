services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: guised_up
      POSTGRES_USER: guised_up
      POSTGRES_PASSWORD: secret
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U guised_up -d guised_up']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  embeddings:
    build: ./backend/embedding-service
    ports:
      - '8001:8001'

volumes:
  postgres-data:
